<main class="login-page">
    <section class="login-panel" aria-labelledby="login-title">

        <header class="login-header">
            <h1 id="login-title">Welcome Back!</h1>
            <p>
                Don't have an account yet?
                <a href="#" class="auth-link">Sign up now</a>
            </p>
        </header>

        <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <div class="form-field">
                <label class="sr-only" for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="Email address"
                    [(ngModel)]="credentials.email" required email />
            </div>

            <div class="form-field password-field">
                <label class="sr-only" for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password"
                    placeholder="Password" [(ngModel)]="credentials.password" required />
            </div>

            @if (loginError) {
                <p class="login-error" role="alert">{{ loginError }}</p>
            }

            <button class="login-button" type="submit" [disabled]="loginForm.invalid || isSubmitting">
                {{ isSubmitting ? 'Logging in...' : 'Log in' }}
            </button>
        </form>
    </section>
</main>
