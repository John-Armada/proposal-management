@if (canReview()) {
<div class="review-panel">
    <h3 class="review-panel__title">Review</h3>

    @if (isOwnProposal()) {
    <p class="text-meta review-panel__notice">You can't review your own proposal.</p>
    } @else {
    <form [formGroup]="form">
        <label class="text-meta" for="review-comment">Comment (optional)</label>
        <textarea id="review-comment" class="form-control review-panel__comment" formControlName="comment" rows="3"
            placeholder="Add context for the author…"></textarea>

        <div class="review-panel__actions">
            <button type="button" class="btn btn-outline-danger" [disabled]="submitting()" (click)="submit('REJECT')">
                Reject
            </button>
            <button type="button" class="btn btn-success" [disabled]="submitting()" (click)="submit('APPROVE')">
                Approve
            </button>
        </div>
    </form>
    }
</div>
}
